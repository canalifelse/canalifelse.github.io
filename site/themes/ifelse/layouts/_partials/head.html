<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>
{{- with or .Description site.Params.description }}
<meta name="description" content="{{ . }}">
{{- end }}
<link rel="icon" type="image/png" href="{{ "favicon.ico" | relURL }}">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
<link rel="preload" href="{{ "fonts/neulis-cursive-400.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
{{- range .AllTranslations }}
<link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">
{{- end }}
{{ partialCached "head/css.html" . }}
{{ partialCached "head/js.html" . }}
