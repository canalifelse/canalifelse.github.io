baseURL = 'https://canalifelse.github.io/'
title = 'IF ELSE'
theme = 'ifelse'

defaultContentLanguage = 'pt-br'
defaultContentLanguageInSubdir = false

[params]
  youtube = 'https://www.youtube.com/@canalifelse'

[languages]
  [languages.pt-br]
    label = 'Português'
    locale = 'pt-BR'
    weight = 1
  [languages.en]
    label = 'English'
    locale = 'en-US'
    weight = 2

[taxonomies]
  branch = 'branches'

[imaging]
  [imaging.webp]
    quality = 80
